# ============================================================
# TOURISME BURKINA RAG — liste curée des sources (Phase 2)
# ------------------------------------------------------------
# Toute source scrapée DOIT figurer ici : pas de crawl incontrôlé,
# pas d'URL ajoutée en cours de route sans entrée dans ce fichier.
#
# Champs :
#   url    : URL canonique à récupérer
#   type   : web | pdf
#   trust  : institutional | encyclopedia | press | blog
#            (utilisé pour départager des preuves contradictoires)
#   notes  : commentaire libre (optionnel)
#
# robots.txt est respecté pour TOUTES les sources, sans exception
# ni liste blanche de contournement. SSL vérifié systématiquement.
# ============================================================

